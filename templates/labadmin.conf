# Default lab filename loaded when labadmin starts (labadmin parameter -l overrides this value)
#  Possible values: one lab config filename stored in /opt/labadmin/labs/ directory 
#  Optional
#  Default: none
# default_lab=

# Network interface used in labadmin to connect with agents (labadmi parameter -i overrides this value)
#  Optional
#  Default: interface used for Internet access
# iface=

# Arp-scan timeout in miliseconds
#  Optional
#  Default: 500
# arpscan_timeout=500

# SSH connection timeout in seconds
#  Optional
#  Default: 5
# ssh_timeout=5

# Auto scan map delay in seconds (0 disable autoscan)
#  Optional
#  Default: 60
# autoscan_delay=60


#===================================================================================
# SSH CONFIG
#===================================================================================
